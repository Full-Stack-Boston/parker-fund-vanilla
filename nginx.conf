server {
    listen 80;
    server_name vanilla.revparkermemorialfund.org;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|webp|map|pdf)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }
}

server {
    listen 80 default_server;
    server_name _;
    return 444;
}
